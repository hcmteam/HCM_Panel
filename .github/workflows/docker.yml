name: Release 3X-UI for Docker

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-latest
            qemu: false
          - platform: linux/arm64/v8
            suffix: arm64
            runner: ubuntu-24.04-arm
            qemu: false
          - platform: linux/arm/v7
            suffix: armv7
            runner: ubuntu-latest
            qemu: true
          - platform: linux/arm/v6
            suffix: armv6
            runner: ubuntu-latest
            qemu: true
          - platform: linux/386
            suffix: 386
            runner: ubuntu-latest
            qemu: true
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/hcmteam/h-panel
          tags: |
            type=raw,value=build-${{ github.sha }}-${{ matrix.suffix }}

      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm,386

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

  publish:
    name: Publish multi-platform image
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/hcmteam/h-panel
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform tags
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
          IMAGE: ghcr.io/hcmteam/h-panel
          SHA: ${{ github.sha }}
        run: |
          manifest_args=()
          while IFS= read -r tag; do
            [ -z "$tag" ] || manifest_args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          docker buildx imagetools create "${manifest_args[@]}" \
            "$IMAGE:build-$SHA-amd64" \
            "$IMAGE:build-$SHA-arm64" \
            "$IMAGE:build-$SHA-armv7" \
            "$IMAGE:build-$SHA-armv6" \
            "$IMAGE:build-$SHA-386"
